<h2>Admin Dashboards</h2>

@if (dashboard(); as data) {

  <p>{{ data.message }}</p>

  <div>
    <h3>Users</h3>

  <div>
    <h3>Products</h3>

  <div>
    <h3>Orders</h3>

  </div>

}
